# Локальная база для разработки. Логин и пароль не секретны: база доступна только на этом компьютере.
name: avocado

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: avocado
      POSTGRES_PASSWORD: avocado
      POSTGRES_DB: avocado
    ports:
      - '5432:5432'
    volumes:
      # С PostgreSQL 18 данные хранятся в подпапке версии, поэтому том подключается к /var/lib/postgresql.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U avocado -d avocado']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  db-data:
